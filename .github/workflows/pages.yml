name: Deploy to GitHub Pages

# Builds the site from main and publishes it to the gh-pages branch, which GitHub Pages serves.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp index.html scan.js sw.js manifest.webmanifest icon.svg icon-*.png .nojekyll _site/
          # New cache name per release so installed copies pick up the update.
          sed -i "s/var VERSION='dev';/var VERSION='${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "VERSION='${GITHUB_SHA::8}'" _site/sw.js
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
