name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest icon.svg icon-*.png .nojekyll _site/
          # New cache name per release so installed copies pick up the update.
          sed -i "s/var VERSION='dev';/var VERSION='${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "VERSION='${GITHUB_SHA::8}'" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
